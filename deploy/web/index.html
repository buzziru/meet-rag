<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>국회 회의록 질의응답</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <aside id="sidebar" class="drawer sidebar open" aria-label="문서 찾기">
    <div class="panel-head">
      <span class="brand">문서 찾기</span>
      <button id="close-sidebar" class="icon-button" type="button" aria-label="문서 찾기 닫기">✕</button>
    </div>
    <p class="muted">적재한 회의록을 연도와 회의로 찾아 읽을 수 있습니다.</p>
    <label class="field">연도
      <select id="year" disabled><option value="">선택</option></select>
    </label>
    <label class="field">회의
      <input id="meeting" type="text" list="meeting-options" autocomplete="off" placeholder="회의 검색" disabled>
    </label>
    <p id="meeting-loading" class="loading muted" role="status" data-text="회의 목록을 불러오고 있습니다"></p>
    <datalist id="meeting-options"></datalist>
    <label class="field">문서
      <input id="document" type="text" list="document-options" autocomplete="off" placeholder="문서 검색" disabled>
    </label>
    <p id="document-loading" class="loading muted" role="status" data-text="문서 목록을 불러오고 있습니다"></p>
    <datalist id="document-options"></datalist>
    <button id="reset" class="ghost-button" type="button">선택 초기화</button>
    <p id="find-status" class="muted" role="status"></p>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <main id="chat" class="chat">
    <header class="topbar">
      <button id="open-sidebar" class="icon-button" type="button" aria-label="문서 찾기 열기" aria-controls="sidebar" hidden>☰</button>
      <button id="new-chat" class="ghost-button" type="button">새 채팅</button>
    </header>
    <div id="scroller" class="scroller">
      <div id="intro" class="intro">
        <h1>국회 회의록 질의응답</h1>
        <p id="scope" class="scope muted">국회 회의록에서 찾아 답하고, 답변마다 근거 원문을 붙입니다.</p>
        <div id="examples" class="examples" role="group" aria-label="추천 질문"></div>
        <p class="muted">무료 공유 GPU로 운영합니다. 오랜만에 접속하면 시작에 약 1분이 걸리고, 평소에도 가끔 답변 시작이 몇 초 늦어질 수 있습니다.</p>
      </div>
      <div id="messages" class="messages"></div>
    </div>
    <form id="composer" class="composer">
      <div class="composer-box">
        <textarea id="input" rows="1" maxlength="1000" placeholder="국회 회의록에 대해 물어보세요" aria-label="질문"></textarea>
        <button id="send" class="send" type="submit" aria-label="보내기">↑</button>
      </div>
      <p id="connection" class="connection muted" role="status" hidden></p>
      <p id="announce" class="sr-only" role="status"></p>
    </form>
  </main>

  <aside id="viewer" class="drawer viewer" aria-label="문서 뷰어">
    <div class="panel-head">
      <h2 id="viewer-title" class="viewer-title"></h2>
      <a id="viewer-original" class="muted" target="_blank" rel="noopener noreferrer" hidden>회의록 원문</a>
      <button id="close-viewer" class="icon-button" type="button" aria-label="문서 뷰어 닫기">✕</button>
    </div>
    <article id="viewer-body" class="doc"></article>
  </aside>
</body>
</html>
