# 후속 질문의 앞 대화 글 묶음 v2 (S51). block_v1에 "더 자세히 묻는데 근거에 앞 답변보다 더한 내용이 없으면 되풀이하지 말고
# 찾지 못했다고 쓰라"는 줄을 더했다. 사용자 대화(2026-11-06)의 "자세히 알려줘"에 앞 답을 되풀이한 사례 때문이다.
# {refusal}은 생성 프롬프트의 거부 문구(prompt.refusal)로 채운다. system 지시와 첫 질문 메시지는 바꾸지 않는다. 앞 답변은 인용 번호를 지운 원문이다(S40 결정 사항 2)
version: block_v2
turn: "질문: {question}\n답변: {answer}"
user: |-
  [앞 대화]
  아래는 이 질문 앞에 나눈 대화입니다. 앞 대화는 이번 질문이 무엇을 가리키는지 이해하는 데만 쓰세요. 답변 내용과 인용 번호는 아래 [근거]에서만 가져오고, 앞 답변의 문장을 그대로 옮기지 마세요. 앞 답변에서 이미 말한 내용만으로 이번 질문에 답할 수 없으면, 답할 수 없는 부분을 지시에 따라 밝히세요.
  이번 질문이 앞 답변의 내용을 더 자세히 묻거나 더 파고드는데 [근거]에 앞 답변보다 더한 내용이 없으면, 앞 답변의 내용을 다시 쓰지 말고 "(더 묻는 내용)은 {refusal}."라고 쓰세요.

  {history}

  {rest}
