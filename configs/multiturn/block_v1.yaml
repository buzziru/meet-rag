# 후속 질문의 앞 대화 글 묶음 v1 (S51). 앞 대화가 있을 때만 생성 프롬프트(v19 등)의 마지막 user 메시지 앞에 붙는다.
# system 지시와 첫 질문 메시지는 바꾸지 않는다. 앞 답변은 인용 번호를 지운 원문이다(S40 결정 사항 2)
version: block_v1
turn: "질문: {question}\n답변: {answer}"
user: |-
  [앞 대화]
  아래는 이 질문 앞에 나눈 대화입니다. 앞 대화는 이번 질문이 무엇을 가리키는지 이해하는 데만 쓰세요. 답변 내용과 인용 번호는 아래 [근거]에서만 가져오고, 앞 답변의 문장을 그대로 옮기지 마세요. 앞 답변에서 이미 말한 내용만으로 이번 질문에 답할 수 없으면, 답할 수 없는 부분을 지시에 따라 밝히세요.

  {history}

  {rest}
