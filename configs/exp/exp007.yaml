# @package _global_
# EXP-007 dense 청크 점수의 문서 집계를 상위 2개 합으로 (H7, docs/experiments/EXP-007.md). 기준 EXP-004 위에 더한다.
# 실행: rag.search +exp=exp007
defaults:
  - exp004
  - _self_

retriever:
  run_name: hybrid-cond-filter-agg2  # EXP-004 순위 파일을 덮어쓰지 않는다
  # dense 문서 점수. max: 최고점 청크(기준 동작), top_sum: 상위 n개 청크 점수의 합(청크가 n개보다 적으면 있는 것만)
  doc_agg:
    method: top_sum
    n: 2
