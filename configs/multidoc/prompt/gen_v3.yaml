# multi-doc 질의 생성 지시 (multidoc-writer 에이전트가 읽는다). 기록을 남긴 뒤에는 고치지 않고 새 버전을 만든다
# v2 대비: 정답 문서 2~5개, 고른 회의의 같은 쟁점 문서를 모두 포함, law 시작 묶음에 같은 회의 문서 추가 허용,
#          열거형과 이어 붙이기의 구분(questioner 열거형 미사용 해소)
version: gen_v3
instruction: |
  국회 회의록 검색 시스템을 평가할 질의를 만든다. 질의 하나는 정답 문서가 2개 이상 5개 이하여야 한다.
  정답 문서는 그 질의의 답이 되는 사실을 담은 문서 전부다. 문서 하나라도 빠지면 답이 불완전해야 한다.
  검사 단계는 후보 집합의 모든 문서를 읽고, 질의의 답이 되는 사실을 담은 문서를 모두 정답으로 센다.
  고른 문서 밖에 같은 질의의 답이 되는 문서가 하나라도 있으면 그 질의는 떨어진다.
  회의록 문서는 발언 구간 단위라, 한 회의에서 한 쟁점의 논의가 여러 문서로 이어지는 일이 흔하다. 이것이 가장 흔한 탈락 원인이다.

  ## 입력
  생성 입력 파일(JSON)에는 후보 집합 하나가 들어 있다.
  - type: conf(같은 회의), law(같은 법안), questioner(같은 질의자·위원회)
  - key: 후보 집합을 묶은 값. questioner는 "질의자ID|위원회"
  - docs: 문서마다 doc_id, 회의 정보(date, committee_name, meeting_name, meeting_number, session_number, agenda),
    speakers(그 문서에서 질의한 사람의 이름·직위), overview(발언 앞부분)
  - seed_doc_ids: law 유형에서 미리 고른 문서. conf·questioner는 빈 목록

  ## 1. 문서 고르기
  순서
  1. 쟁점(또는 아래 열거형의 범위)을 정하고 핵심 문서를 고른다
  2. 고른 문서와 같은 회의(같은 date·committee_name·meeting_number·session_number)의 나머지 문서 overview를 모두 훑어,
     같은 쟁점을 다룰 수 있는 문서를 정답 후보에 더한다. 정답 후보의 원문을 읽고, 쟁점이 다르면 뺀다.
     원문은 overview로 정답 후보에 넣은 문서만 읽는다
  3. 정답 문서가 5개를 넘으면 쟁점을 더 좁히거나(조항 하나, 기관 하나, 사업 하나) 다른 쟁점을 고른다. 2개 미만이면 다른 쟁점을 고른다

  유형별
  - law: seed_doc_ids는 모두 정답에 둔다. 빼거나 다른 문서로 바꾸지 않는다. 시작 묶음 문서와 같은 회의에서 같은 쟁점을 다룬 문서만 더할 수 있다
  - conf: 같은 쟁점(같은 법안의 같은 조항, 같은 정책 사안, 같은 기관의 같은 문제)을 다룬 문서들을 고른다
  - questioner: 모든 문서의 질의자가 같은 사람이다. 아래 2절의 입장 변화형이나 열거형 중 하나로 쓸 수 있는 문서들을 고른다

  ## 2. 질의 쓰기
  공통
  - 정답 문서마다 다른 정답 문서에 없는 사실이 답에 하나 이상 들어가게 쓴다. 한 문서만 읽어도 답할 수 있으면 다시 쓴다
  - 질의에 범위를 정하는 정보(조항, 사업 이름, 기관, 회의 날짜·위원회)를 넣어, 정답 문서 밖의 문서가 답이 되지 않게 한다
  - 국회 회의록을 찾는 사람이 쓸 만한 한국어 문장 하나로 쓴다. 날짜, 위원회, 법안 이름, 기관 이름, 의원 이름은 써도 된다
  - doc_id, "문서 1", "첫 번째 회의록"처럼 입력 형식을 드러내는 말은 쓰지 않는다
  - 원문에 없는 내용을 전제하지 않는다

  열거형과 이어 붙이기
  - 열거형은 공통 축(인물, 법안, 회의, 기관, 시기 중 하나 이상) 안의 항목을 모두 묻는 질의다. 허용한다
    예: "a 위원이 2019년 국정감사에서 HUG에 대해 지적한 사항들은?", "ㄱ법 개정안 심사에서 2017년 ○○소위와 2019년 △△소위에서 각각 논의된 쟁점은?"
  - 열거형은 그 범위에 드는 문서를 모두 정답에 넣어야 한다. 범위 안의 문서가 5개를 넘으면 범위를 좁힌다
  - 이어 붙이기는 공통 축이 없는 사안 둘을 "각각"으로 묶은 질의다. 쓰지 않는다
    예: 서로 다른 의원이 서로 다른 법안을 다룬 두 문서를 "X법과 Y법은 각각?"으로 묶는 것

  유형별
  - law: 시작 묶음 문서들이 같은 법안의 서로 다른 조항이나 다른 의원안을 다루면, 회의를 날짜·위원회(같으면 회기·차수)로 특정한 열거형을 쓴다
  - questioner: speakers의 이름으로 인물 중심 질의를 쓴다. 이름과 직위는 메타데이터에서 가져오고, 답의 내용(사안, 입장, 사업)은 원문에 있어야 한다
    - 입장 변화형: "a 위원이 ㄱ 사안에 대해 각 회의에서 밝힌 입장은?"
    - 열거형: "a 위원이 ○○위원회 ○○년 심사에서 지적한 사업들은?" 이 경우 그 범위에서 a 위원이 질의한 문서를 모두 정답에 넣는다.
      a 위원이 서로 다른 사안을 질의했어도 범위가 공통 축이므로 이어 붙이기가 아니다

  ## 3. 기대 답과 근거
  - answer: 정답 문서의 내용과 메타데이터만으로 쓴 답. 3~8문장
  - evidence: 정답 문서마다 하나 이상. quote는 그 문서 원문에서 그대로 복사한 연속된 구간(한 문장 안팎). 띄어쓰기와 문장부호도 원문 그대로 둔다.
    "……" 같은 생략 부호를 넣거나 중간을 빼지 않는다. 요약하거나 고치면 불통과가 된다

  ## 4. skip
  다음이면 질의를 쓰지 않고 skip한다. 억지로 만든 질의는 검사나 사람 검수에서 떨어진다.
  - 위 조건을 만족하는 정답 문서 2~5개를 찾을 수 없다
  - 정답 문서마다 꼭 필요한 사실이 들어가는 질의를 쓸 수 없다(한 문서가 다른 문서의 내용을 모두 담는 경우 등)
  - 원문이 절차 발언(개의·산회 선언, 의사일정 낭독)뿐이다

  ## 출력
  gen_out 디렉터리에 {pool_id}.json 하나를 UTF-8로 쓴다. 필드는 아래뿐이다.
  {
    "pool_id": "...",
    "prompt_version": "gen_v3",
    "status": "ok" 또는 "skip",
    "seed_doc_ids": ["정답 doc_id", ...],
    "query": "질의 (skip이면 빈 문자열)",
    "answer": "기대 답 (skip이면 빈 문자열)",
    "evidence": [{"doc_id": "...", "quote": "원문 그대로의 구간"}, ...],
    "skip_reason": "skip 이유 한 문장 (ok면 빈 문자열)"
  }
