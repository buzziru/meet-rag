# multi-doc 질의 생성 지시 (multidoc-writer 에이전트가 읽는다). 기록을 남긴 뒤에는 고치지 않고 새 버전을 만든다
# v1 대비: 질의자 메타데이터(speakers), 유형별 규칙(conf 쟁점 범위, law 회의 특정 열거형, questioner 인물 중심 질의)
version: gen_v2
instruction: |
  국회 회의록 검색 시스템을 평가할 질의를 만든다. 질의 하나는 정답 문서가 2개나 3개여야 한다.
  정답 문서는 그 질의에 완전히 답하는 데 꼭 필요한 문서다. 문서 하나라도 빠지면 답이 불완전해야 한다.
  검사 단계는 후보 집합의 모든 문서를 읽고, 질의의 답이 되는 사실을 담은 문서를 모두 정답으로 센다.
  그래서 고른 문서 밖에도 같은 사실을 담은 문서가 있으면 그 질의는 떨어진다.

  ## 입력
  생성 입력 파일(JSON)에는 후보 집합 하나가 들어 있다.
  - type: conf(같은 회의), law(같은 법안), questioner(같은 질의자·위원회)
  - key: 후보 집합을 묶은 값. questioner는 "질의자ID|위원회"
  - docs: 문서마다 doc_id, 회의 정보(date, committee_name, meeting_name, meeting_number, session_number, agenda),
    speakers(그 문서에서 질의한 사람의 이름·직위), overview(발언 앞부분)
  - seed_doc_ids: law 유형에서 미리 고른 문서. conf·questioner는 빈 목록

  ## 1. 문서 고르기
  - law: seed_doc_ids를 그대로 쓴다. 다른 문서를 더하거나 빼지 않는다
  - conf: overview와 회의 정보로 같은 쟁점(같은 법안의 같은 조항, 같은 정책 사안)을 다루는 문서 2개나 3개를 고른다.
    고른 뒤 나머지 문서의 overview를 다시 훑어, 같은 쟁점을 다루는 문서가 모두 4개 이상이면 그 쟁점을 버리고 다른 쟁점을 고른다
  - questioner: 모든 문서의 질의자가 같은 사람이다. overview와 회의 정보로 그 사람이 같은 사안을 다룬 문서,
    또는 한 질의로 묶어 물을 만한 문서 2개나 3개를 고른다
  - 고른 문서의 원문만 읽는다. 원문을 읽고 조건이 맞지 않으면 다른 문서로 한 번 더 고를 수 있다. 그래도 없으면 skip한다

  ## 2. 질의 쓰기
  공통
  - 고른 문서마다 다른 문서에 없는 사실이 답에 하나 이상 들어가게 쓴다. 예: 두 회의에서 각각 나온 입장의 차이, 시기에 따른 변화, 질의와 그에 대한 다른 회의의 답변
  - 한 문서만 읽어도 답할 수 있으면 다시 쓴다
  - 질의에 고른 문서에만 있는 사실(조항, 사업 이름, 기관, 시기)을 넣어 범위를 좁힌다. 후보 집합의 다른 문서도 답이 될 만큼 넓게 쓰지 않는다
  - 서로 무관한 법안·사안 둘을 "각각"으로 이어 붙인 질의는 쓰지 않는다. 질문 두 개를 한 문장에 넣은 것이기 때문이다
  - 국회 회의록을 찾는 사람이 쓸 만한 한국어 문장 하나로 쓴다. 날짜, 위원회, 법안 이름, 기관 이름, 의원 이름은 써도 된다
  - doc_id, "문서 1", "첫 번째 회의록"처럼 입력 형식을 드러내는 말은 쓰지 않는다
  - 원문에 없는 내용을 전제하지 않는다

  유형별
  - law: 시작 묶음 문서가 같은 법안의 서로 다른 조항이나 다른 의원안을 다루면, 회의를 날짜·위원회로 특정한 열거형을 쓸 수 있다.
    예: "ㄱ법 개정안 심사에서 2017년 ○○소위와 2019년 △△소위에서 각각 논의된 쟁점은?" 회의를 특정하지 않으면 다른 회의의 문서도 정답이 된다
  - questioner: speakers의 이름으로 인물 중심 질의를 쓸 수 있다. 이름과 직위는 메타데이터에서 가져오고, 답의 내용(사안, 입장, 사업)은 원문에 있어야 한다
    - 입장 변화형: "a 위원이 ㄱ 사안에 대해 각 회의에서 밝힌 입장은?"
    - 열거형: "a 위원이 ○○위원회 ○○년 심사에서 지적한 사업들은?" 회의나 시기를 특정해 고른 문서만 답이 되게 한다

  ## 3. 기대 답과 근거
  - answer: 고른 문서의 내용과 메타데이터만으로 쓴 답. 3~6문장
  - evidence: 고른 문서마다 하나 이상. quote는 그 문서 원문에서 그대로 복사한 연속된 구간(한 문장 안팎). 띄어쓰기와 문장부호도 원문 그대로 둔다.
    "……" 같은 생략 부호를 넣거나 중간을 빼지 않는다. 요약하거나 고치면 불통과가 된다

  ## 4. skip
  다음이면 질의를 쓰지 않고 skip한다. 억지로 만든 질의는 검사나 사람 검수에서 떨어진다.
  - 조건을 만족하는 문서 2개를 찾을 수 없다
  - 문서마다 꼭 필요한 사실이 들어가는 질의를 쓸 수 없다(한 문서가 다른 문서의 내용을 모두 담는 경우 등)
  - 원문이 절차 발언(개의·산회 선언, 의사일정 낭독)뿐이다

  ## 출력
  gen_out 디렉터리에 {pool_id}.json 하나를 UTF-8로 쓴다. 필드는 아래뿐이다.
  {
    "pool_id": "...",
    "prompt_version": "gen_v2",
    "status": "ok" 또는 "skip",
    "seed_doc_ids": ["고른 doc_id", ...],
    "query": "질의 (skip이면 빈 문자열)",
    "answer": "기대 답 (skip이면 빈 문자열)",
    "evidence": [{"doc_id": "...", "quote": "원문 그대로의 구간"}, ...],
    "skip_reason": "skip 이유 한 문장 (ok면 빈 문자열)"
  }
