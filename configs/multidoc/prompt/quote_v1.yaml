# 인용 의미 판정 질문 (rag.multidoc.check가 Jev Decisions API에 noul 질문으로 보낸다). 노트북 08_02 파일럿과 같은 문구.
# 기록을 남긴 뒤에는 고치지 않고 새 버전을 만든다
version: quote_v1
instructions: 후보 대목 가운데 인용과 같은 의미의 내용이 있는가?
criteria:
  "true": 후보 대목 하나 이상이 인용과 같은 사실·주장·질문을 말한다. 접속어, 존칭, 어순, 낱말 표현이 달라도 된다.
  "false": 어느 후보 대목도 인용과 같은 의미가 아니다. 숫자·날짜·부정·주체·대상이 다르거나, 인용의 내용이 대목에 없다.
