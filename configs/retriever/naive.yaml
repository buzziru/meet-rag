# config group `retriever`
# 최상위에 `retriever:` 키를 다시 쓰지 않는다
# 여기 내용은 composed config에서 `cfg.retriever.*`로 올라온다.
type: naive
top_k: 10
# 문서 top_k개를 채우기 위해 먼저 뽑는 청크 수. 05 노트북 5절 실측으로 정했다
chunk_pool: 50

# 구현체. hydra.utils.instantiate로 만든다 — 교체는 여기만 바꾸거나 다른 그룹 파일을 고른다.
# top_k·chunk_pool은 생성자 인자가 아니라 호출 시점 인자라 이 블록 밖에 있다.
impl:
  _target_: rag.retrieve.DenseRetriever
