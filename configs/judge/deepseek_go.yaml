# 생성 평가 judge: DeepSeek V4.1 Flash, opencode Go 구독 경로 (D-38, docs/slices/14-gen-eval.md)
# Console 종량제 경로(/inference/openai/v1)는 잔액에서 차감해 쓰지 않는다
defaults:
  - prompt: j_v5
  - _self_

name: deepseek_go  # judge 결과 파일 이름(paths.gen_judge)
base_url: https://opencode.ai/inference/go/openai/v1
api_key_env: OPENCODE_API_KEY
model: deepseek-v4.1-flash
# Go 문서는 클라이언트가 자기 User-Agent와 대화마다 고정한 x-opencode-session을 보내라고 한다(2026-10-19)
user_agent: meet-rag-judge/0.1
params:
  temperature: 0.0
  max_tokens: 16384  # 사고 과정 토큰 포함 상한. 4096은 사고 과정이 다 써 본문이 빈 응답이 20질의 중 6건(S14)
# 요청 본문에 더하는 값. 사고 과정은 모델 기본값(켜짐)을 그대로 쓴다. 끄는 값을 정하면 여기에 둔다
extra_body: null
# 호출 하나의 대기 상한(초)과 SDK 재시도 수. 성공 호출 6,985건의 지연은 최대 108초(p99.9 82초)라
# 2분 넘게 응답이 없으면 정상 응답이 어렵다고 본다. 재시도 1회(시도 2회)면 호출 하나가 최대 약 4분이다
# (사용자 결정 2026-10-27, 이슈 #156). 둘 다 judge 레시피와 캐시 키에 들어가지 않는다
timeout: 120
max_retries: 1
concurrency: 4  # 동시에 채점하는 생성 기록 수
# judge 반복 번호(S24). 0보다 크면 캐시 키와 결과 경로에 붙어 같은 답변을 같은 지시로 다시 채점한다.
# 0이면 반복 도입 전과 같은 키·경로다(D-49 캐시 키)
rep: 0
