# deepseek_go_nothink에서 조건부 규칙이 걸린 두 단계만 사고 과정을 낮은 강도로 켠 judge (PR #106, 2026-10-20)
# j_v3 사고 과정 끔 채점에서 verdicts(유도 질문 규칙)와 key_statements(사용 불가·긍정 명제·상대 주장 제외)의
# 규칙이 적용되지 않았다. DeepSeek 문서: thinking enabled와 reasoning_effort(low|high|max)를 함께 쓴다
defaults:
  - deepseek_go_nothink
  - _self_

name: deepseek_go_mixed
# 질의 동시 수 8(동시 API 호출 최대 32). S25 베이스라인 첫 실행에서 429·실패 없이 새 230질의를 15분에
# 채점했다(S24 동시 4 어림의 절반). 16 이상은 Judge.ask 재시도를 정한 뒤 확인한다(D-50, S25)
concurrency: 8
step_params:
  verdicts:
    reasoning_effort: low
    extra_body:
      thinking:
        type: enabled
  key_statements:
    reasoning_effort: low
    extra_body:
      thinking:
        type: enabled
  # 발언자 세 갈래는 조건부 규칙이라 사고 과정을 켠다(S14c). item_handling은 기본(끔)
  items:
    reasoning_effort: low
    extra_body:
      thinking:
        type: enabled
