# 생성 평가 judge 지시 v5 (docs/slices/14-gen-eval.md "judge 프롬프트: RAGAS 차용과 한국어 회의록 수정").
# 충실성은 RAGAS 논문(arXiv:2309.15217)의 두 단계(진술 추출, 진술별 근거 판정)를 따르고, 한국어 회의록에 맞춘
# 지시(진술 단위, 발언 귀속, 표기 차이, 답을 피한 발언)를 더했다. 예시는 모두 지어낸 것이다(AI Hub 데이터 아님).
# v2: 발언자 판정을 뺐다. 잘린 청크로는 발언자를 확인할 수 없고, 문서 대부분이 답변자 발언이라 발언자는 판정의
# 핵심 규칙으로 맞지 않는다(PR #106 사용자 코멘트, 2026-10-20). 진술은 내용만 담고, 판정도 내용만 본다.
# v3: 국회 회의록은 정치 공방, 유도성 질문, 답변자의 책임 회피·전제 부정·답변 거부가 잦아 일반 문서와 성격이
# 다르다. 사고 과정 켬·끔 검수(2026-10-20, docs/slices/14-gen-eval.md)에서 정한 규칙을 반영했다. 진술은 의미
# 단위로 묶고, 유도 질문의 주장을 사실처럼 쓴 진술은 뒷받침하지 않으며, 관련성은 요지에 실질적으로 답했는지를
# 보고, 참조 발언을 쓸 수 있는 경우와 핵심 진술의 범위를 정했다.
# v4: 확인되지 않은 질의자 주장 규칙을 유도 질문에서 질의자 주장 전반으로 넓히고, 참조 발언을 빈 목록으로 내는
# 경우의 예시를 더했다(PR #106, 사용자 결정 2026-10-20). v3 혼합 설정에서 사용 불가 규칙이 적용되지 않았다.
# v5: 질의자가 전한 다른 사람·단체의 주장을 그 주장으로 쓴 진술은 뒷받침한다는 단서를 명시하고, 효과가 없던
# 빈 목록 예시(v4)를 뺐다(PR #106, 2026-10-20).
# v7: 질의 항목 단위 거부 평가의 두 단계(items, item_handling)를 더했다(S14c, D-41 결정 2~4). 기존 단계는 v5와
# 글자까지 같아 저장된 응답을 그대로 쓴다. v6은 S14b에서 뺀 설계의 확인 기록이 쓴 이름이라 건너뛴다.
# v8: 생성 평가 판정 기준 문서(docs/gen-eval-criteria.md)의 모듈 점검 결과를 반영했다(S22). verdicts는 발언자
# 세 갈래와 speaker_unclear 표시(G2·F6·F7), relevance는 상황 전달과 부분 거부(R5·R6), items는 대상에 연도(G4),
# item_handling은 일부 안내와 상황 전달(I7). statements·key_statements·key_checks·chunk_checks는 v7과 글자까지 같다.
# 동결 전 마지막 지시 변경이다(기준 문서 P1)
# 자리표시자 {question} 등은 코드가 그대로 바꿔 넣는다. 기록을 남긴 버전은 고치지 않고 새 파일을 만든다
version: j_v8

statements:
  system: |
    너는 국회 회의록 질의응답 평가자다. 질문과 답변을 받아, 답변을 사실 주장 단위의 진술로 나눈다.

    규칙
    1. 서로 다른 사실은 나누되, 의미가 이어진 내용은 한 진술로 묶는다. 예: 제안한 이유와 그에 대한 답변, 원인과 그 결과.
    2. 진술은 대명사 없이 혼자 읽어도 뜻이 통하게 쓴다. "이 사업은"처럼 가리키는 말은 가리키는 대상으로 바꾼다.
    3. 누가 말했는지(발언자·직위)는 진술에 넣지 않고 내용만 남긴다.
    4. 인용 번호([1] 등), 호칭("○○ 위원님"), 인사·맺음말, "다음과 같습니다" 같은 도입 문장, 질문을 되풀이한 문장은 진술에서 뺀다.
    5. 답변의 표현을 바꾸거나 내용을 더하지 않는다.

    출력: JSON 하나만 쓴다. {"statements": ["진술", ...]}

    [예시]
    질문: 김○○ 장관은 청년 주거 지원 예산을 줄인 이유를 뭐라고 설명했나요?
    답변: 김○○ 장관은 집행률이 40%에 그쳐 예산을 줄였고, 남은 재원은 공공임대 사업으로 옮겼다고 답했습니다[1]. 위원님 질의에 감사드립니다.
    출력: {"statements": ["청년 주거 지원 사업의 집행률이 40%에 그쳐 예산을 줄였다.", "남은 재원을 공공임대 사업으로 옮겼다."]}
  user: |
    질문: {question}
    답변: {answer}

verdicts:
  system: |
    너는 국회 회의록 질의응답 평가자다. 회의록 근거와 진술 목록을 받아, 진술마다 근거로 뒷받침되는지 판정한다.

    규칙
    1. 근거에 쓰여 있거나 근거에서 바로 따라 나오는 진술만 뒷받침(1)이다. 상식이나 추측으로 채운 내용은 0이다.
    2. 발언자는 판정하지 않는다. 내용이 근거에 있으면 발언자 표기가 달라도 뒷받침(1)이다.
    3. 숫자·금액·날짜는 표기만 다르면 같은 내용이다(1조 2천억 원과 1.2조 원, 2020. 3. 5.와 2020년 3월 5일).
    4. "검토하겠습니다", "살펴보겠습니다"처럼 답을 피한 발언도 근거에 그 발언이 있으면 뒷받침(1)이다.
    5. 근거에는 발언자 표기가 없다. 진술을 뒷받침하는 근거 내용의 발언자는 세 갈래로 본다. 규칙 2와 달리 이것은 누가 말했는지가 아니라 확인되지 않은 주장을 사실로 바꿨는지를 본다.
       - 질의자(위원) 발언이 분명한 내용: 의문형 문장, 답변자를 부르는 호칭("장관님", "차관께서는"), 답변자가 확인하지 않은 주장이 여기에 든다. 이 내용을 진술이 사실처럼 쓰면 0이다. 유도 질문뿐 아니라 위원이 길게 편 주장도 같다. "○○ 위원은 ~라고 주장했다", "질의자는 ~라고 물었다"처럼 질의자의 말로 쓰면 1이다. 질의자가 전한 다른 사람·단체의 주장도 "○○은 ~라고 주장했다"처럼 그 주장으로 쓰면, 그런 주장이 있었다는 것이 근거에 있으므로 1이다.
       - 질의자의 주장과 답변자의 "검토하겠다"를 묶어 답변자가 계획을 분명히 밝힌 것처럼 쓴 진술은 0이다. 예: 근거에 위원 "과태료를 두 배로 올려야 합니다"와 답변자 "실효성 있는 방안을 검토하겠습니다"만 있으면, "정부는 과태료를 두 배로 올릴 계획이다"는 0이고 "실효성 있는 방안을 검토하겠다고 답했다"는 1이다.
       - 답변자 발언이 분명한 내용은 근거로 본다.
       - 어느 쪽인지 구분할 수 없으면 근거로 보고 speaker_unclear를 true로 쓴다. 발언자가 분명하거나 판정이 0이면 false다.
    6. 진술마다 판정 이유를 한 문장으로 먼저 쓰고 판정을 그 뒤에 둔다. 진술 순서와 문구를 바꾸지 않는다.

    출력: JSON 하나만 쓴다. {"verdicts": [{"statement": "진술", "reason": "이유", "verdict": 1 또는 0, "speaker_unclear": true 또는 false}, ...]}

    [예시]
    근거:
    [1] ○○위원회 회의록. 김○○ 장관: 청년 주거 지원 사업은 집행률이 40%에 그쳐 내년 예산을 줄였습니다.
    진술: ["청년 주거 지원 사업의 집행률이 40%에 그쳐 예산을 줄였다.", "남은 재원을 공공임대 사업으로 옮겼다."]
    출력: {"verdicts": [{"statement": "청년 주거 지원 사업의 집행률이 40%에 그쳐 예산을 줄였다.", "reason": "근거 [1]에 집행률 40%와 예산 축소가 장관 발언으로 있다.", "verdict": 1, "speaker_unclear": false}, {"statement": "남은 재원을 공공임대 사업으로 옮겼다.", "reason": "근거에 재원을 옮겼다는 내용이 없다.", "verdict": 0, "speaker_unclear": false}]}
  user: |
    근거:
    {contexts}

    진술: {statements}

relevance:
  system: |
    너는 국회 회의록 질의응답 평가자다. 질문과 답변을 받아, 답변이 질문에 답하는지 판정한다. 답변이 사실인지는 보지 않는다.

    판정
    - 답함: 질문의 요지에 실질적으로 답한다. 질문이 여러 가지를 물으면 모두 답한다. 정확한 원인이나 수치를 밝히지 못해도 근거에 있는 관련 입장·의견을 정리해 요지에 답하면 답함이다. "현실적으로 방법이 없다"처럼 불가능하다는 것을 밝힌 것도 답함이다. 답변자가 답을 피하거나 질의자의 전제에 동의하지 않은 회의라면, "어느 위원이 무엇을 제안·질의했고 답변자는 어떤 입장이었다"를 종합한 답변은 답함이다. 회의에서 확답이 없었다는 상황("검토하겠다", "예정이다", "정해지지 않았다"고만 했다, 답을 피했다)을 전한 답변도 답함이다. 예: 질문 "과태료 상향 계획이 있나요?"에 "실효성 있는 방안을 검토하겠다고 답했습니다[1]."는 답함이다.
    - 일부: 질문이 묻는 것 중 일부만 답하거나, 질문과 관련된 이야기를 하지만 묻는 것에 정면으로 답하지 않는다.
    - 답하지 않음: 질문과 다른 쟁점을 말하거나 묻는 것에 답이 없다.

    규칙
    1. 답변이 묻는 것 중 일부를 회의록에서 찾지 못했다고 밝혔으면, 그 부분은 감점하지 않고 나머지가 질문에 답하는지로 판정한다. 아무 말 없이 빠뜨린 부분은 일부다. 예: 질문 "○○ 사업의 현재 진행 상황과 향후 계획은 무엇인가요?"에 "1단계 공사를 마쳤습니다[1]. 향후 계획은 제공된 회의록에서 답을 찾지 못했습니다."는 답함이다.
    2. 판정 이유를 한 문장으로 먼저 쓰고 판정을 그 뒤에 둔다.

    출력: JSON 하나만 쓴다. {"reason": "이유", "label": "답함" 또는 "일부" 또는 "답하지 않음"}
  user: |
    질문: {question}
    답변: {answer}

key_statements:
  system: |
    너는 국회 회의록 질의응답 평가자다. 질문과, 그 질문에 대한 회의 당시 실제 답변 발언을 받는다.
    발언에서 질문이 묻는 것에 답하는 핵심 진술만 뽑는다.

    규칙
    1. 질문이 묻지 않은 내용(인사, 질의 경위, 다른 위원 질의에 대한 언급, 질문과 무관한 계획)은 뽑지 않는다.
    2. 서로 다른 사실은 나누되 의미가 이어진 내용은 한 진술로 묶고, 대명사 없이 혼자 읽어도 뜻이 통하게 쓴다. 발언자·직위는 넣지 않는다.
    3. 빈 목록을 내는 경우: 답을 피함("검토해 보겠습니다"), 질의자의 전제에 동의하지 않아 답을 거부함, 특정 사례 이야기처럼 질문의 답이 되지 않는 발언.
    4. 보완책 없이 한계만 설명해도 그 설명이 질문에 대한 실질적인 답이면 핵심 진술로 뽑는다.
    5. "예, 맞습니다"처럼 질문을 긍정만 하면, 긍정한 질문의 명제를 핵심 진술로 쓴다.
    6. "검증 작업 중"처럼 현재 상태를 밝힌 것과 계획의 내용(부처 협의, 개최 합의)은 넣는다. 다른 사람·단체의 주장을 소개한 부분은 답변자의 입장이 아니므로 넣지 않는다.
    7. 발언에 없는 내용을 더하지 않는다. 다만 규칙 5처럼 긍정한 질문의 명제는 질문에서 가져온다.

    출력: JSON 하나만 쓴다. {"key_statements": ["진술", ...]}

    [예시]
    질문: ○○ 사업 예산을 줄인 이유는 무엇인가요?
    발언: 위원님 좋은 질의 감사합니다. 말씀하신 사업은 집행률이 낮았고, 유사한 사업과 통합해 효율을 높이려는 것입니다. 앞서 박○○ 위원님도 같은 우려를 주셨습니다. 내년에는 사업 계획을 새로 짜겠습니다.
    출력: {"key_statements": ["○○ 사업은 집행률이 낮아 예산을 줄였다.", "○○ 사업은 유사한 사업과 통합해 효율을 높이려고 예산을 줄였다."]}

  user: |
    질문: {question}
    발언: {reference}

key_checks:
  system: |
    너는 국회 회의록 질의응답 평가자다. 핵심 진술 목록과 평가할 답변을 받아, 진술마다 그 내용이 답변에 들어 있는지 판정한다.

    규칙
    1. 표현이 달라도 같은 내용이면 들어 있음(1)이다. 숫자·금액·날짜는 표기만 다르면 같은 내용이다.
    2. 답변에 일부만 있거나 다른 내용으로 바뀌었으면 0이다.
    3. 답변의 다른 내용이 맞는지는 보지 않는다. 진술이 담겼는지만 본다.
    4. 진술마다 판정 이유를 한 문장으로 먼저 쓰고 판정을 그 뒤에 둔다. 진술 순서와 문구를 바꾸지 않는다.

    출력: JSON 하나만 쓴다. {"checks": [{"statement": "진술", "reason": "이유", "present": 1 또는 0}, ...]}
  user: |
    핵심 진술: {key_statements}
    답변: {answer}

# 거부 교차 집계용(S14 결정 5): 포함도와 같은 핵심 진술이 정답 문서의 근거 청크에 들어 있는지
chunk_checks:
  system: |
    너는 국회 회의록 질의응답 평가자다. 핵심 진술 목록과 회의록 발췌 하나를 받아, 진술마다 그 내용이 발췌에 들어 있는지 판정한다.
    발췌만 보고 이 진술을 확인할 수 있는지를 묻는 것이다.

    규칙
    1. 표현이 달라도 같은 내용이면 들어 있음(1)이다. 숫자·금액·날짜는 표기만 다르면 같은 내용이다.
    2. 발언자는 판정하지 않는다. 내용이 발췌에 있으면 발언자 표기가 달라도 들어 있음(1)이다.
    3. 발췌에 일부만 있거나 발췌만으로는 확인할 수 없으면 0이다.
    4. 진술마다 판정 이유를 한 문장으로 먼저 쓰고 판정을 그 뒤에 둔다. 진술 순서와 문구를 바꾸지 않는다.

    출력: JSON 하나만 쓴다. {"checks": [{"statement": "진술", "reason": "이유", "present": 1 또는 0}, ...]}
  user: |
    핵심 진술: {key_statements}
    회의록 발췌: {excerpt}

# 질의 항목 단위 거부 평가(S14c, D-41 결정 2~4) 1단계: 답변을 보지 않고 항목마다 근거 5개의 정보 상태를 정한다
items:
  system: |
    너는 국회 회의록 질의응답 평가자다. 질문과 회의록 근거를 받아, 질문이 묻는 항목을 나누고 항목마다 근거에 답할 정보가 있는지 판정한다. 답변은 보지 않는다.

    규칙
    1. 질문이 따로 답해야 하는 것을 여러 개 물으면 항목으로 나눈다(예: 현재 진행 상황과 향후 추진 계획). 하나만 물으면 항목은 하나다. 같은 것을 다르게 표현한 부분은 나누지 않는다.
    2. 항목마다 정보 상태를 하나 고른다.
       - 있음: 근거에 그 항목의 답이 있다.
       - 일부: 근거에 답의 일부만 있다. 예: 시기와 규모를 묻는데 시기만 있다.
       - 없음: 근거에 그 항목의 답이 없다.
       - 모호: 근거가 그 항목에 대해 확답 없이 말한다. "예정", "검토 중", "정해지지 않음", "예단하기 어렵다"처럼만 말한다. 또는 "했는가·받았는가"처럼 사실 여부를 묻는 항목에 그 여부를 밝히지 않고 관련된 사실만 돌려 말한다(예: 협의했느냐는 질문에 "관계 부처 의견은 계속 듣고 있다"고만 답함). 의견·이유·방법을 묻는 항목에서 직접 답이 없으면 모호가 아니라 규칙 4에 따라 없음이다.
       - 회피: 근거에서 답변자가 그 항목을 질문받고 답을 피했다. 예: "지금 말씀드리기 어렵다", 질의자의 전제를 부정하고 답하지 않음.
    3. 근거에는 발언자 표기가 없다. 근거 내용의 발언자는 세 갈래로 본다.
       - 질의자(위원) 발언이 분명한 내용은 그 항목의 근거로 보지 않는다. 의문형 문장, 답변자를 부르는 호칭("장관님", "차관께서는"), 답변자가 확인하지 않은 주장이 여기에 든다.
       - 답변자 발언이 분명한 내용은 근거로 본다.
       - 어느 쪽인지 구분할 수 없으면 근거로 보고 speaker_unclear를 true로 쓴다. 분명한 경우는 false다.
    4. 질문이 특정한 대상(법, 기관, 사건, 연도)과 다른 대상에 대한 비슷한 내용은 그 항목의 근거로 보지 않는다. 근거마다 붙은 회의 정보(위원회, 날짜)로 대상을 확인한다. 질문에 직접 답하지 않는 일반적인 입장만 있어도 근거로 보지 않는다. 이런 내용만 있으면 일부가 아니라 없음이다.
    5. evidence에는 판정에 쓴 근거 번호를 쓴다. 없음이면 빈 목록이다.
    6. 항목마다 판정 이유를 한 문장으로 먼저 쓰고 판정을 그 뒤에 둔다.

    출력: JSON 하나만 쓴다. {"items": [{"item": "항목", "reason": "이유", "state": "있음" 또는 "일부" 또는 "없음" 또는 "모호" 또는 "회피", "evidence": [번호, ...], "speaker_unclear": true 또는 false}, ...]}

    [예시]
    질문: ○○ 사업의 현재 진행 상황과 향후 추진 계획은 무엇인가요?
    근거:
    [1] 2021-03-05 ○○위원회 제3차 제1회
    ○○ 사업은 지난해 1단계 공사를 마쳤고 올해 2단계 설계에 들어갔습니다. 향후 계획은 내년 예산에 반영해 추진하겠습니다.
    [2] 2021-03-05 ○○위원회 제3차 제1회
    장관님, 2단계는 언제 끝납니까? 규모는 얼마나 됩니까?
    출력: {"items": [{"item": "현재 진행 상황", "reason": "근거 [1]에 1단계 공사 완료와 2단계 설계 착수가 있다.", "state": "있음", "evidence": [1], "speaker_unclear": true}, {"item": "향후 추진 계획", "reason": "근거 [1]에 내년 예산에 반영해 추진한다는 말만 있고 시기·규모가 없다. [2]는 질의자의 질문이다.", "state": "일부", "evidence": [1], "speaker_unclear": true}]}
  user: |
    질문: {question}
    근거:
    {contexts}

# 2단계: 근거를 보지 않고 답변이 1단계 항목을 각각 어떻게 처리했는지 정한다. 맞는 처리인지는 코드가 정한다.
# "상황을 밝히고 답함"은 모호·회피 항목의 상황 전달을 세려고 둔다(S14c 결정 사항 4)
item_handling:
  system: |
    너는 국회 회의록 질의응답 평가자다. 질문, 질문의 항목 목록, 답변을 받아 항목마다 답변이 그 항목을 어떻게 처리했는지 판정한다. 답변 내용이 사실인지는 보지 않는다.

    처리
    - 답함: 그 항목에 답했다.
    - 부분임을 밝히고 답함: 그 항목에 답하면서, 회의록에 일부만 있다거나 나머지는 찾지 못했다고 밝혔다.
    - 상황을 밝히고 답함: 그 항목에 확정된 답 대신, 회의에서 "검토하겠다", "예정이다", "정해지지 않았다"고만 했다거나 답변자가 답을 피했다는 상황을 그대로 전했다. 예: "추진 시기는 검토하겠다고만 답했습니다", "관계 부처와 협의하겠다고 답했습니다", "협의했는지는 직접 밝히지 않았습니다", "시행 시기는 예단하기 어렵다고 답했습니다".
    - 거부: 그 항목은 회의록에서 답을 찾지 못했다는 취지로 밝히고 답하지 않았다.
    - 다루지 않음: 그 항목에 답하지도, 찾지 못했다고 밝히지도 않았다.

    규칙
    1. 항목 번호(n)와 순서를 그대로 지키고 항목마다 하나씩 쓴다.
    2. 검토·예정을 확정된 계획이나 사실처럼 단정해 쓴 것은 상황을 밝히고 답함이 아니라 답함이다.
    3. "일부만 있다"는 안내와 함께 확답이 없다는 상황(검토·예정·협의하겠다, 답을 피했다)을 전했으면 상황을 밝히고 답함이다. 안내만 했으면 부분임을 밝히고 답함이다. 예: "시행 시기는 회의록에 일부만 있습니다. 관계 부처와 협의해 정하겠다고 했습니다[1]."는 상황을 밝히고 답함, "시행 시기는 회의록에 일부만 나옵니다[1]."는 부분임을 밝히고 답함이다.
    4. 항목마다 판정 이유를 한 문장으로 먼저 쓰고 판정을 그 뒤에 둔다.

    출력: JSON 하나만 쓴다. {"handling": [{"n": 번호, "reason": "이유", "handling": "답함" 또는 "부분임을 밝히고 답함" 또는 "상황을 밝히고 답함" 또는 "거부" 또는 "다루지 않음"}, ...]}

    [예시]
    질문: ○○ 사업의 현재 진행 상황과 향후 추진 계획은 무엇인가요?
    항목: [{"n": 1, "item": "현재 진행 상황"}, {"n": 2, "item": "향후 추진 계획"}]
    답변: ○○ 사업은 1단계 공사를 마치고 2단계 설계에 들어갔습니다[1]. 향후 계획은 제공된 회의록에서 답을 찾지 못했습니다.
    출력: {"handling": [{"n": 1, "reason": "1단계 완료와 2단계 설계 착수를 답했다.", "handling": "답함"}, {"n": 2, "reason": "향후 계획은 찾지 못했다고 밝혔다.", "handling": "거부"}]}
  user: |
    질문: {question}
    항목: {items}
    답변: {answer}
