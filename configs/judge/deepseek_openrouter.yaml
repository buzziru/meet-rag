# 생성 평가 judge 대안 경로: 같은 모델의 OpenRouter 유료 경로 (D-38). Go 사용이 막히면 judge=deepseek_openrouter
defaults:
  - prompt: j_v5
  - _self_

name: deepseek_openrouter
base_url: https://openrouter.ai/api/v1
api_key_env: OPENROUTER_API
model: deepseek/deepseek-v4.1-flash
user_agent: meet-rag-judge/0.1
params:
  temperature: 0.0
  max_tokens: 16384
extra_body: null
timeout: 300
concurrency: 4
rep: 0  # judge 반복 번호(S24). deepseek_go.yaml과 같다
