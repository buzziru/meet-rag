defaults:
  - eval: spec_v1
  - chunking: fixed
  - retriever: dense
  - generator: gemma
  - prompt: v1
  - _self_

# 분할·표본 추출용. 값은 docs/SPEC.md와 같다
seed: 20260929

# G1 summary_q 검수 표본 크기 (SPEC 미결 1)
g1_sample_size: 100

# G3 multi-doc 질의 검수 표본 크기 (PLAN G3)
g3_sample_size: 50
# G3 범위 재판정 대상: 이 유형에서 must와 any(정규식)가 함께 나오는 질의 (08_04 노트북, 사용자 결정 2026-10-08)
g3_scope:
  type: law
  must: 각각
  any: 쟁점|질의와 답변

# 저장소 루트 기준 상대경로. 쓰는 쪽에서 루트와 결합한다
paths:
  raw_dir: data
  corpus: data/processed/corpus_context.jsonl
  queries: data/processed/queries_summary_q.jsonl
  # dev 질의만 내보낸 파일. Colab 질의 임베딩에 올린다(D-07)
  queries_dev: data/processed/queries_summary_q.dev.jsonl
  splits: data/splits/queries.csv
  dev_small_docs: data/splits/dev_small_docs.txt
  g1_sample: data/review/g1_summary_q.csv
  # 설정마다 경로를 분리한다. data/는 브랜치를 따라 바뀌지 않는다
  index_dir: data/index/${embedding.slug}-${chunking.name}-${chunking.chunk_tokens}-${chunking.overlap_tokens}/${index.scope}
  # 범위별 질의 임베딩. 청킹과 무관해 후보끼리 다시 쓴다
  query_emb: data/index/${embedding.slug}/queries-${index.scope}.npz
  runs_dir: data/runs
  # 생성 호출 기록. 호출마다 JSON 하나
  generate_dir: data/runs/generate
  # multi-doc 후보 집합과 시작 묶음 (docs/slices/07-bundles.md)
  multidoc_pools: data/multidoc/pools.jsonl
  # S8 생성 입력·문서 원문·생성 출력·검사 기록(후보 집합마다 파일 하나), 통과 질의 (docs/slices/08-multidoc-queries.md)
  multidoc_gen_in: data/multidoc/gen_in
  multidoc_docs: data/multidoc/docs
  multidoc_gen_out: data/multidoc/gen_out
  multidoc_check_in: data/multidoc/check_in  # 검사 입력(S8c, multidoc-checker가 읽는다)
  multidoc_check_out: data/multidoc/check_out  # 검사 출력(multidoc-checker가 쓴다)
  multidoc_check: data/multidoc/check
  multidoc_queries: data/multidoc/queries.jsonl
  multidoc_review: data/multidoc/review/g3_sample.md  # G3 검수 파일. 검수 칸은 비워 둔다
  multidoc_scope_review: data/multidoc/review/g3_scope.md  # G3 범위 재판정 파일

embedding:
  model_name: nlpai-lab/KURE-v1
  slug: kure-v1
  normalize: true
  device: cpu
  # 로컬 cpu·float32, Colab은 명령에서 cuda·float16으로 바꾼다
  dtype: float32
  # 배치 크기 × 배치 안 최대 토큰 수의 상한. GPU 메모리에 맞춰 바꾼다
  max_batch_tokens: 16384
  max_batch_size: 64
  # 질의 임베딩 최대 길이. summary_q는 최대 약 260자(약 130토큰)
  query_max_tokens: 512

# 평가 분할. 값은 docs/SPEC.md "분할"·"평가 층"과 같다
splits:
  dev_min_queries: 3000
  test_min_queries: 3000
  dev_small_min_docs: 1000

# 인덱스 생성 (docs/slices/04-index.md)
index:
  scope: dev-small  # dev-small | full
  shard_size: 2048  # 임베딩 조각당 청크 수. 조각 단위로 재개한다
  max_docs: null  # 디버그용. 앞에서부터 이 수의 문서만 처리한다

# 검색 실행 방식 (docs/slices/05-retrieve.md)
search:
  mode: run  # run | export-queries(로컬) | embed-queries(VM)

# 생성 질의 (rag.generate). dev 질의는 qid, 자유 질의는 query 하나만 준다
ask:
  qid: null
  query: null

# 청크 크기 비교. overlap은 크기의 1/8
chunk_sweep:
  candidates: [[256, 32], [512, 64], [1024, 128], [8192, 1024]]
  recall_ks: [1, 5, 10]
  mrr_ks: [1, 5, 10]

# multi-doc 묶음 구성 (docs/slices/07-bundles.md). 값은 D-13에서 확정
multidoc:
  types: [conf, law, questioner]
  pool_max_docs: 20  # 완전성 검사가 후보 집합 전체를 읽으므로 크기 상한
  # 유형별 준비 수. law를 바꾸면 rng 소비가 달라져 questioner 순서가 바뀐다(D-13, S8 결정 2026-10-06)
  n_pools_per_type: {conf: 350, law: 250, questioner: 350}
  seed_sizes: [2, 3]  # law 시작 묶음의 문서 수 후보. conf·questioner는 S8이 고른다
  # S8 생성(multidoc-writer 에이전트). 지시 본문은 configs/multidoc/prompt/
  gen:
    n_per_type: 10  # 유형마다 order 앞에서부터 꺼낼 후보 집합 수. 파일럿 10
    overview_chars: 300  # 문서 선택용 개요 길이(context 앞 글자 수)
    max_gold: 5  # 생성 쪽 정답 문서 수 상한. Complete@5가 가능한 최대값(사용자 결정 2026-10-06)
    # 유형별 생성 지시 버전. 메인이 multidoc-writer에 넘길 지시 파일을 고른다(코드는 쓰지 않는다).
    # 파일럿 conf order 0~9와 law는 gen_v3로 만들었다(docs/slices/08-multidoc-queries.md)
    prompt_version: {conf: gen_v4, law: gen_v3, questioner: gen_v4}
  # S8 검사 입력 지시와 판정(검사는 multidoc-checker 에이전트, D-14)
  check:
    # 검사는 multidoc-checker 에이전트(Sonnet)가 check_in 파일을 읽고 check_out에 쓴다(D-14, S8c).
    # api_key_env는 Jev 인용 의미 판정(OpenRouter)에 쓴다
    api_key_env: OPENROUTER_API
    prompt_version: check_v3
    # 형식이 틀린 검사 출력(중단으로 쓰다 만 출력 포함)은 rejected/로 옮겨 다시 검사한다. 거부가 이 횟수에
    # 닿으면 자동 재검사를 멈추고 보류(held)로 둔다. 판정에는 넣지 않는다(PR #37·#38 코멘트)
    max_rejects: 3
    # 검사 입력에서 이 글자 수를 넘는 줄(본문, 안건 등 문서 머리)을 문장 끝에서 나눈다. 한 줄이 2만~7.4만
    # 자인 문서를 작업자가 Read 상한 때문에 끝까지 읽지 못했다(G3 본 생성, law-0085 등 본문, conf-0026 안건)
    max_line_chars: 2000
    # 인용 의미 판정(D-14, 노트북 08_02). 원문에 그대로 없는 인용만 문서를 window_sentences문장씩 묶은
    # 대목 중 partial_ratio 상위 top_k개를 골라 Jev에 묻고, 같은 의미일 확률이 min_prob 이상이면 인정한다.
    # 파일럿에서 바꿔 옮긴 인용·원문 그대로 24개 0.93~0.98, 뜻을 바꾼 변형 30개 중 0.9 이상 4개(모두 부정)
    quote_semantic:
      url: https://openrouter.ai/api/alpha/decisions
      model: typesafe/jev-1.13
      prompt_version: quote_v1
      top_k: 3
      window_sentences: 3
      min_prob: 0.9
      timeout: 60  # Jev 호출 하나의 대기 상한(초)
