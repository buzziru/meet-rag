defaults:
  - eval: spec_v1
  - eval@eval_gen: gen_v1  # 생성 설정 비교의 판정 기준값(S27)
  - chunking: fixed
  - retriever: dense
  - generator: openrouter
  - prompt: v2
  - judge: deepseek_go_mixed  # 기본 사고 과정 끔 + verdicts·key_statements·items만 low(D-40, S14c)
  # j_v8 = 생성 평가 판정 기준 반영(S22). 바뀐 단계는 verdicts·relevance·items·item_handling이고, 나머지는
  # j_v7과 같아 저장 응답을 그대로 쓴다. 동결 전 마지막 지시 변경이다
  - override judge/prompt: j_v8
  - _self_

# 분할·표본 추출용. 값은 docs/SPEC.md와 같다
seed: 20260929

# 지문(basis.json) 없는 기존 산출물(인덱스, 재정렬 점수)에 지금 설정으로 지문만 쓰고 끝낸다(S15).
# 만든 설정을 EXP 실행 기록과 대조한 뒤 명령에서 켠다
adopt_basis: false

# G1 summary_q 검수 표본 크기 (SPEC 미결 1)
g1_sample_size: 100

# G3 multi-doc 질의 검수 표본 크기 (PLAN G3)
g3_sample_size: 50
# G3 범위 재판정 대상: 이 유형에서 must와 any(정규식)가 함께 나오는 질의 (08_04 노트북, 사용자 결정 2026-10-08)
g3_scope:
  type: law
  must: 각각
  any: 쟁점|질의와 답변
# G3 law 질의 재판정(범위 모호·정답 내용 불일치). 작업 하나에 입력 크기 합 max_chars, 질의 max_queries 이하
g3_judge:
  prompt_version: scope_v2
  max_chars: 60000
  max_queries: 10
# G2 기준 오답 질의 검토(PLAN G2, 사용자 결정 2026-10-15). 기준 설정의 dev-full 상위 top개 실패 전부를
# 에이전트가 두 단계(1: 질의와 정답 문서만, 2: 검색 상위 top개와 대조)로 판단하고 사람이 확인한다
g2:
  exp: exp014  # 오답을 정하는 기준 설정(D-32)
  top: 5
  near: 20  # 결합 전 목록의 최선 순위가 top 밖 near 안이면 근접(24_01과 같은 경계)
  max_line_chars: 2000  # 작업자 입력의 줄 길이 상한(multidoc.check.max_line_chars와 같은 이유)
  agenda_chars: 300  # 작업자 입력의 안건 글자 수 상한. 안건이 수만 자인 문서가 있다
  stage1: s1_v1  # configs/g2/prompt/의 지시 파일 이름
  stage2: s2_v1

# 저장소 루트 기준 상대경로. 쓰는 쪽에서 루트와 결합한다
paths:
  raw_dir: data
  corpus: data/processed/corpus_context.jsonl
  queries: data/processed/queries_summary_q.jsonl
  # 질의 조건 추출용 값 사전. 코퍼스 문서 필드에서만 만든다(S10, rag.meta_dict)
  meta_dict: data/processed/meta_dict.json
  # 질의 조건 추출 결과(S11, rag.conditions). 세트마다 파일 하나
  conditions: data/conditions/${search.queries}.jsonl
  # dev 질의만 내보낸 파일. Colab 질의 임베딩에 올린다(D-07)
  queries_dev: data/processed/queries_summary_q.dev.jsonl
  splits: data/splits/queries.csv
  dev_small_docs: data/splits/dev_small_docs.txt
  g1_sample: data/review/g1_summary_q.csv
  # 설정마다 경로를 분리한다. data/는 브랜치를 따라 바뀌지 않는다
  index_dir: data/index/${embedding.slug}-${chunking.name}-${chunking.chunk_tokens}-${chunking.overlap_tokens}/${index.scope}
  # 범위별 질의 임베딩. 청킹과 무관해 후보끼리 다시 쓴다
  query_emb: data/index/${embedding.slug}/queries-${index.scope}.npz
  # multi-doc 동결 세트 질의 임베딩과, 그 qid·query만 내보낸 VM 업로드 파일 (docs/slices/09-multidoc-eval.md)
  query_emb_multidoc: data/index/${embedding.slug}/queries-multidoc.npz
  query_emb_test: data/index/${embedding.slug}/queries-test.npz  # test 질의 임베딩(로컬, S13)
  queries_multidoc_vm: data/multidoc/queries_g3.vm.jsonl
  runs_dir: data/runs
  # 질의 재작성 응답(EXP-013). 만든 기준을 함께 적고 읽을 때 대조한다. 재작성기·지시마다 파일 하나
  rewrites: data/rewrites/${rewriter.name}-${rewriter.prompt.version}.json
  # 생성 호출 기록. 호출마다 JSON 하나
  generate_dir: data/runs/generate
  # 생성 평가(S14). 일괄 생성 기록(질의마다 한 줄), judge 결과, judge 응답 저장(요청 본문 해시마다 파일 하나)
  # 반복 번호(gen_eval.gen_rep, judge.rep)는 0이면 붙지 않는다(rep resolver, S24)
  gen_runs: data/gen_eval/runs/${retriever.run_name}-${prompt.version}-${gen_eval.queries}${ctx:${gen_eval.contexts}}${spk:${speakers.mode}}${rep:${gen_eval.gen_rep}}.jsonl
  gen_judge: data/gen_eval/judge/${retriever.run_name}-${prompt.version}-${gen_eval.queries}${ctx:${gen_eval.contexts}}${spk:${speakers.mode}}${rep:${gen_eval.gen_rep}}-${judge.name}-${judge.prompt.version}${rep:${judge.rep}}.jsonl
  gen_judge_cache: data/gen_eval/judge_cache
  gen_dev_queries: configs/gen_eval/dev_queries.yaml  # judge 지시 개발에 쓴 질의. dev-full 표본에서 뺀다(S22)
  # multi-doc 후보 집합과 시작 묶음 (docs/slices/07-bundles.md)
  multidoc_pools: data/multidoc/pools.jsonl
  # S8 생성 입력·문서 원문·생성 출력·검사 기록(후보 집합마다 파일 하나), 통과 질의 (docs/slices/08-multidoc-queries.md)
  multidoc_gen_in: data/multidoc/gen_in
  multidoc_docs: data/multidoc/docs
  multidoc_gen_out: data/multidoc/gen_out
  multidoc_check_in: data/multidoc/check_in  # 검사 입력(S8c, multidoc-checker가 읽는다)
  multidoc_check_out: data/multidoc/check_out  # 검사 출력(multidoc-checker가 쓴다)
  multidoc_check: data/multidoc/check
  multidoc_queries: data/multidoc/queries.jsonl
  multidoc_review: data/multidoc/review/g3_sample.md  # G3 검수 파일. 검수 칸은 비워 둔다
  multidoc_scope_review: data/multidoc/review/g3_scope.md  # G3 범위 재판정 파일
  multidoc_exclude: configs/multidoc/g3_exclude.yaml  # G3 검수에서 뺀 질의
  multidoc_frozen: data/multidoc/queries_g3.jsonl  # G3 동결 세트. S9 입력
  multidoc_judge_in: data/multidoc/judge_in  # G3 재판정 입력(서브에이전트가 읽는다)
  multidoc_judge_out: data/multidoc/judge_out  # G3 재판정 출력(서브에이전트가 쓴다)
  multidoc_judge_jobs: data/multidoc/judge_jobs.jsonl
  # G2 입력(in1·in2), 작업자 출력(out1·out2), 검수 파일(rag.g2)
  g2_dir: data/review/g2

# 화자 이름 정규화(S10, D-20). 공백으로 나뉜 이름의 마지막 토막이 이 직함으로 끝나면 첫 토막을 이름으로 둔다
ingest:
  name_titles: [위원, 의원, 장관, 위원장, 의장, 차관, 청장, 총리, 대표, 간사]

# 질의 조건 추출(S11). 이름 뒤에 이 조사나 ingest.name_titles가 오면 이름 경계로 인정한다
conditions:
  name_suffixes: [의, 이, 가, 은, 는, 을, 를, 과, 와, 도, 만, 에게, 께서, 에]
  # 사전 이름 칸에 있지만 이름이 아닌 값. 한글 밖 문자나 직함으로 끝나는 값은 코드가 뺀다(D-21)
  name_exclude: [정부, 징세과장]
  # 위원회 공식·관용 약칭 → 위원회 이름(시기별로 여럿이면 모두). 이름은 값 사전에 있어야 한다(S11b, D-22)
  committee_aliases:
    법사위: [법제사법위원회]
    기재위: [기획재정위원회]
    재경위: [재정경제위원회]
    행안위: [행정안전위원회]
    안행위: [안전행정위원회]
    행자위: [행정자치위원회]
    환노위: [환경노동위원회]
    복지위: [보건복지위원회, 보건복지가족위원회]
    외통위: [외교통일위원회, 외교통상통일위원회]
    통외통위: [통일외교통상위원회]
    농해수위: [농림축산식품해양수산위원회]
    농식품위: [농림수산식품위원회]
    농해위: [농림해양수산위원회]
    산자위: [산업통상자원중소벤처기업위원회, 산업통상자원위원회, 산업자원위원회]
    국토위: [국토교통위원회, 국토해양위원회]
    건교위: [건설교통위원회]
    교문위: [교육문화체육관광위원회]
    교과위: [교육과학기술위원회]
    과방위: [과학기술정보방송통신위원회]
    과기정통위: [과학기술정보통신위원회]
    미방위: [미래창조과학방송통신위원회]
    문체위: [문화체육관광위원회]
    문광위: [문화관광위원회]
    문방위: [문화체육관광방송통신위원회]
    운영위: [국회운영위원회]
    여가위: [여성가족위원회]
    지경위: [지식경제위원회]
    예결위: [예산결산특별위원회]
    정개특위: [정치개혁특별위원회]
    사개특위: [사법개혁특별위원회]
    헌개특위: [헌법개정특별위원회]
    국회 본회의: [국회본회의]

embedding:
  model_name: nlpai-lab/KURE-v1
  # HF 커밋 고정(D-46). 2026-09-07 main. kure-v1 산출물(2026-10-01~08)은 모두 이 커밋으로 만들었다
  revision: 8b418a58414668e75532ed045c22d9ca018ae2b2
  slug: kure-v1
  normalize: true
  device: cpu
  # 로컬 cpu·float32, Colab은 명령에서 cuda·float16으로 바꾼다
  dtype: float32
  # 배치 크기 × 배치 안 최대 토큰 수의 상한. GPU 메모리에 맞춰 바꾼다
  max_batch_tokens: 16384
  max_batch_size: 64
  # 질의 임베딩 최대 길이. summary_q는 최대 약 260자(약 130토큰)
  query_max_tokens: 512

# 평가 분할. 값은 docs/SPEC.md "분할"·"평가 층"과 같다
splits:
  dev_min_queries: 3000
  test_min_queries: 3000
  dev_small_min_docs: 1000

# 인덱스 생성 (docs/slices/04-index.md)
index:
  scope: dev-small  # dev-small | full
  shard_size: 2048  # 임베딩 조각당 청크 수. 조각 단위로 재개한다
  max_docs: null  # 디버그용. 앞에서부터 이 수의 문서만 처리한다
  chunk_only: false  # true면 chunks.jsonl만 만들고 임베딩하지 않는다(로컬 청킹 뒤 VM 임베딩, EXP-012)

# 검색 실행 방식 (docs/slices/05-retrieve.md)
search:
  mode: run  # run | rerank-pairs(재정렬 후보 쌍, EXP-005) | export-queries(로컬) | embed-queries(VM)
  queries: summary_q  # summary_q | multidoc(G3 동결 세트, index.scope=full만) | test(단계마다 종료 시 1회, 검색은 S13)
  allow_test: false  # search.queries=test는 이 값이 true일 때만 쓴다(SPEC, S13)
  overwrite: false  # 같은 경로에 내용이 다른 순위 파일이 있으면 멈춘다. true면 덮어쓴다(S12)

# 생성 질의 (rag.generate). dev 질의는 qid, 자유 질의는 query 하나만 준다
ask:
  qid: null
  query: null

# 청크 크기 비교. overlap은 크기의 1/8
chunk_sweep:
  candidates: [[256, 32], [512, 64], [1024, 128], [8192, 1024]]
  recall_ks: [1, 5, 10]
  mrr_ks: [1, 5, 10]

# multi-doc 묶음 구성 (docs/slices/07-bundles.md). 값은 D-13에서 확정
multidoc:
  types: [conf, law, questioner]
  # S9 채점 (docs/SPEC.md "보조 관찰"). 순위 파일은 질의마다 서로 다른 문서 max(ks)개 이상
  eval:
    ks: [5, 10]
    breakdowns: [type]
  pool_max_docs: 20  # 완전성 검사가 후보 집합 전체를 읽으므로 크기 상한
  # 유형별 준비 수. law를 바꾸면 rng 소비가 달라져 questioner 순서가 바뀐다(D-13, S8 결정 2026-10-06)
  n_pools_per_type: {conf: 350, law: 250, questioner: 350}
  seed_sizes: [2, 3]  # law 시작 묶음의 문서 수 후보. conf·questioner는 S8이 고른다
  # S8 생성(multidoc-writer 에이전트). 지시 본문은 configs/multidoc/prompt/
  gen:
    n_per_type: 10  # 유형마다 order 앞에서부터 꺼낼 후보 집합 수. 파일럿 10
    overview_chars: 300  # 문서 선택용 개요 길이(context 앞 글자 수)
    max_gold: 5  # 생성 쪽 정답 문서 수 상한. Complete@5가 가능한 최대값(사용자 결정 2026-10-06)
    # 유형별 생성 지시 버전. 메인이 multidoc-writer에 넘길 지시 파일을 고른다(코드는 쓰지 않는다).
    # 파일럿 conf order 0~9와 law는 gen_v3로 만들었다(docs/slices/08-multidoc-queries.md)
    prompt_version: {conf: gen_v4, law: gen_v3, questioner: gen_v4}
  # S8 검사 입력 지시와 판정(검사는 multidoc-checker 에이전트, D-14)
  check:
    # 검사는 multidoc-checker 에이전트(Sonnet)가 check_in 파일을 읽고 check_out에 쓴다(D-14, S8c).
    # api_key_env는 Jev 인용 의미 판정(OpenRouter)에 쓴다
    api_key_env: OPENROUTER_API
    prompt_version: check_v3
    # 형식이 틀린 검사 출력(중단으로 쓰다 만 출력 포함)은 rejected/로 옮겨 다시 검사한다. 거부가 이 횟수에
    # 닿으면 자동 재검사를 멈추고 보류(held)로 둔다. 판정에는 넣지 않는다(PR #37·#38 코멘트)
    max_rejects: 3
    # 검사 입력에서 이 글자 수를 넘는 줄(본문, 안건 등 문서 머리)을 문장 끝에서 나눈다. 한 줄이 2만~7.4만
    # 자인 문서를 작업자가 Read 상한 때문에 끝까지 읽지 못했다(G3 본 생성, law-0085 등 본문, conf-0026 안건)
    max_line_chars: 2000
    # 인용 의미 판정(D-14, 노트북 08_02). 원문에 그대로 없는 인용만 문서를 window_sentences문장씩 묶은
    # 대목 중 partial_ratio 상위 top_k개를 골라 Jev에 묻고, 같은 의미일 확률이 min_prob 이상이면 인정한다.
    # 파일럿에서 바꿔 옮긴 인용·원문 그대로 24개 0.93~0.98, 뜻을 바꾼 변형 30개 중 0.9 이상 4개(모두 부정)
    quote_semantic:
      url: https://openrouter.ai/api/alpha/decisions
      model: typesafe/jev-1.13
      prompt_version: quote_v1
      top_k: 3
      window_sentences: 3
      min_prob: 0.9
      timeout: 60  # Jev 호출 하나의 대기 상한(초)

# 근거 청크의 발언자 표시(S29, docs/slices/29-speakers.md). off(기본)는 지금과 같은 입력, head는 문서의
# 질의자·답변자 머리 줄, marks는 머리 줄과 라벨 발언이 겹친 구간 표지. 생성과 judge가 같이 본다.
# off가 아니면 생성 레시피와 기록 경로(paths.gen_runs·gen_judge)에 붙는다. off는 YAML에서 따옴표로 쓴다
speakers:
  mode: "off"

# 생성 평가(docs/slices/14-gen-eval.md). 질의는 평가 층(dev-small | dev-full)의 dev 질의만 쓴다
gen_eval:
  # 판정용 세트: dev-full에서 개발 질의를 뺀 seed 순서의 앞 330개(D-50, S24 변동 폭 측정).
  # S14 표본 재채점처럼 개발 층을 볼 때는 gen_eval.queries=dev-small gen_eval.n=20으로 바꾼다
  queries: dev-full
  n: 330  # seed로 섞은 순서의 앞에서 자른다. n을 늘려도 앞 표본이 유지된다
  seed: ${seed}
  # 생성 반복 번호(S24). 같은 질의를 같은 설정으로 다시 생성해 생성 잡음을 잰다. 0이면 반복 도입 전과 같은 경로다
  gen_rep: 0
  # 생성 근거 조건(S26 오라클 진단). retrieved는 검색 기준 근거, oracle은 정답 문서가 상위 5개에 없으면
  # 5번째를 정답 문서로 바꾸고, no_gold는 정답 문서를 빼고 다음 문서로 채운다. 근거가 검색 기준과 같아지는
  # 질의는 생성하지 않는다. retrieved가 아니면 생성·judge 경로에 -oracle·-no_gold가 붙는다
  contexts: retrieved
  # 생성 호출 동시 수(S24 결정 사항 1·2). 검색은 차례로 하고 생성 API 호출만 이 수만큼 동시에 보낸다
  concurrency: 4
  # 포함도용 핵심 진술 중 정답 문서의 근거 청크에 든 비율(judge chunk_checks)이 이 값 이상이면 청크에 답이
  # 있다고 본다. 거부 교차 집계에 쓴다(S14 결정 5, 사용자 결정 2026-10-19). 근거가 부족한 잠정값이라
  # report가 비율 분포를 함께 남기고, 그 분포를 근거로 나중에 정한다(PR #106 코멘트, 2026-10-20)
  chunk_key_min: 0.5
  # 질의 항목 단위 거부 평가(S14c, D-41 결정 2~4). 켜면 모든 생성 기록에 judge 단계 items·item_handling을
  # 더 부른다(질의당 2회). judge 지시 파일에 두 단계가 없으면 judge 호출 전에 멈춘다.
  # 키 이름 items는 DictConfig.items 메서드와 겹쳐 속성으로 읽으면 늘 참이 되므로 쓰지 않는다
  item_eval: true
  # 판정 확인 사례(S14c): 생성 기록 대신 합성 답변 사례 파일(jsonl)을 항목 평가로만 채점한다. 결과는
  # 같은 이름의 .judge.jsonl에 쓴다. 질의 원문이 있어 data/ 아래에 둔다
  item_cases: null
  # 내용 없는 문장(인사말, 도입 문장)의 문구. 이 문구가 든 문장은 인용 검사의 문장 수에서 빼고
  # 따로 센다. 생성 프롬프트 v2도 이런 문장을 쓰지 말라고 지시한다(PR #106 코멘트, 2026-10-20)
  filler_phrases: [다음과 같습니다, 아래와 같습니다, 감사합니다, 안녕하십니까]
  # 지정 거부 문구 없이 거부한 문장: 이 조각이 모두 든 문장(공백 무시). 거부 판별과 지표는 바꾸지
  # 않고 report에서 형식 문제로만 센다. S25 베이스라인의 미판별 거부 23개가 모두 이 형태다(이슈 #156)
  unlisted_refusal: [제공된 회의록에서, 찾지 못했]
  # 블라인드 확인(S25, rag.gen_eval.blind): 판정용 결과(base)에 없고 풀 결과(pool)에만 있는 질의에서
  # m개를 고른다. 실패 없는 질의를 clean_share만큼 넣어 TNR을 낸다. 한 회의는 한 질의만 넣는다.
  # 질의 원문이 있어 검수 문서·정답 키는 data/ 아래에 쓴다
  blind:
    base: data/gen_eval/judge/hybrid-cond-filter-law-ms256-k20-ce-v2-dev-full-deepseek_go_mixed-j_v8-n330.jsonl
    pool: data/gen_eval/judge/hybrid-cond-filter-law-ms256-k20-ce-v2-dev-full-deepseek_go_mixed-j_v8-n430.jsonl
    m: 12
    clean_share: 0.33
    seed: ${seed}
    out: data/gen_eval/blind/s25
    bootstrap: 2000
  # 사람 검수 파일(rag.gen_eval.review): 두 judge 설정의 결과를 나란히 둔다. 질의 원문이 있어 data/ 아래에 쓴다
  review:
    judges: [deepseek_go, deepseek_go_nothink]
    out: data/review/s14_judge_think
