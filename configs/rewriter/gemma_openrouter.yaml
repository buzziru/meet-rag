# 질의 재작성기: Gemma 4 31B, OpenRouter 유료 API (실험용, EXP-013). 배포는 gemma_google을 쓴다
defaults:
  - prompt: rw_v1
  - _self_

name: openrouter  # 재작성 파일 이름(paths.rewrites)
base_url: https://openrouter.ai/api/v1
api_key_env: OPENROUTER_API
model: google/gemma-4-31b-it
# 사고 과정. 실험에서는 끈다(사용자 결정 2026-10-14). 배포 경로(Google)는 끌 수 없어(D-11) 품질·지연이 다를 수 있다
reasoning: false
params:
  temperature: 0.0
  max_tokens: 2048  # 사고 과정 토큰 포함 상한
timeout: 60  # 호출 하나의 대기 상한(초)
concurrency: 8  # 동시 요청 수
