[project]
name = "meet-rag"
version = "0.1.0"
description = "국회 회의록 기반 한국어 RAG 질의응답 시스템"
requires-python = "==3.12.*"
dependencies = [
    # 임베딩
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    # 한국어 형태소 분석 (BM25 토크나이징)
    "kiwipiepy>=0.20",
    # 희소 검색
    "bm25s>=0.2",
    # 생성 모델 호출 (OpenAI 호환 엔드포인트 공용 — Gemini, OpenRouter)
    "openai>=1.40",
    # 표본 검수, 분포 집계, reports 생성
    "pandas>=2.2",
    "openpyxl>=3.1.5",
    "langchain-core>=1.5.3",
    "hydra-core>=1.3.5",
    "langchain-google-genai>=4.3.3",
    "python-dotenv>=1.2.2",
    # OpenAI 호환 엔드포인트 채팅 모델 (ADR 0008) — Gemini · vLLM 공용
    "langchain-openai>=1.5.1",
]

[project.optional-dependencies]
cpu = ["torch>=2.6"]
cu126 = ["torch>=2.6"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    # Cursor 노트북 커널. Jupyter 서버는 설치하지 않는다
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
